name: mtsenv

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - tqdm
  - scikit-learn
  - scikit-optimize
  - xgboost=2.1.4
  - shap
  - matplotlib
  - seaborn
  - biopython
  - jupyterlab
  - ipykernel
  - nbconvert
  - openpyxl
  - pip
  - pip:
      - plotly
      - matplotlib-venn
      - logomaker
      - py3Dmol
